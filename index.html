<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المدرسين والطلاب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="appStyles"></style>
</head>
<body>
    <div id="app">
        <!-- سيتم تحميل المحتوى ديناميكيًا هنا -->
        <div class="loading-screen">
            <div class="spinner"></div>
            <h2>جاري التحميل...</h2>
        </div>
    </div>

    <script>
        // استيراد ملفات التطبيق
        const styleTag = document.getElementById('appStyles');
        const cssContent = `
            @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
            
            :root {
                --primary: #3498db;
                --primary-dark: #2980b9;
                --secondary: #2ecc71;
                --secondary-dark: #27ae60;
                --accent: #9b59b6;
                --danger: #e74c3c;
                --warning: #f39c12;
                --success: #2ecc71;
                --info: #3498db;
                --dark: #34495e;
                --light: #ecf0f1;
                --gray: #95a5a6;
                --white: #ffffff;
                --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
                --transition: all 0.3s ease;
                --border-radius: 8px;
            }
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Tajawal', sans-serif;
                background-color: #f8f9fa;
                color: #333;
                direction: rtl;
                overflow-x: hidden;
            }
            
            body.en {
                direction: ltr;
            }
            
            .loading-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: var(--primary);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                color: white;
            }
            
            .spinner {
                width: 50px;
                height: 50px;
                border: 5px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top-color: white;
                animation: spin 1s ease-in-out infinite;
                margin-bottom: 20px;
            }
            
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 15px;
            }
            
            /* Header Styles */
            header {
                background-color: var(--primary);
                color: white;
                padding: 1rem 0;
                box-shadow: var(--shadow);
                position: sticky;
                top: 0;
                z-index: 100;
            }
            
            .header-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 1.5rem;
                font-weight: bold;
            }
            
            .logo i {
                font-size: 2rem;
            }
            
            .user-menu {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            
            .lang-switch {
                cursor: pointer;
                background: rgba(255, 255, 255, 0.2);
                padding: 5px 10px;
                border-radius: var(--border-radius);
                display: flex;
                align-items: center;
                gap: 5px;
                transition: var(--transition);
            }
            
            .lang-switch:hover {
                background: rgba(255, 255, 255, 0.3);
            }
            
            .notifications {
                position: relative;
                cursor: pointer;
            }
            
            .notifications i {
                font-size: 1.3rem;
            }
            
            .notifications-count {
                position: absolute;
                top: -8px;
                right: -8px;
                background-color: var(--danger);
                color: white;
                border-radius: 50%;
                width: 18px;
                height: 18px;
                font-size: 0.7rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .user-profile {
                display: flex;
                align-items: center;
                gap: 10px;
                cursor: pointer;
                padding: 5px 10px;
                border-radius: var(--border-radius);
                transition: var(--transition);
            }
            
            .user-profile:hover {
                background: rgba(255, 255, 255, 0.2);
            }
            
            .avatar {
                width: 35px;
                height: 35px;
                border-radius: 50%;
                background-color: var(--light);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--primary);
                font-weight: bold;
            }
            
            /* Sidebar Styles */
            .main-container {
                display: flex;
                min-height: calc(100vh - 70px);
            }
            
            .sidebar {
                width: 250px;
                background-color: white;
                box-shadow: var(--shadow);
                transition: var(--transition);
                height: calc(100vh - 70px);
                position: sticky;
                top: 70px;
                padding: 20px 0;
            }
            
            .sidebar.collapsed {
                width: 70px;
            }
            
            .sidebar-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px 20px;
                border-bottom: 1px solid var(--light);
                margin-bottom: 20px;
            }
            
            .sidebar-toggle {
                cursor: pointer;
                color: var(--gray);
                transition: var(--transition);
            }
            
            .sidebar-toggle:hover {
                color: var(--dark);
            }
            
            .nav-menu {
                list-style: none;
            }
            
            .nav-item {
                margin-bottom: 5px;
            }
            
            .nav-link {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 20px;
                color: var(--dark);
                text-decoration: none;
                transition: var(--transition);
                border-right: 3px solid transparent;
            }
            
            .sidebar.collapsed .nav-link {
                justify-content: center;
                padding: 12px;
            }
            
            .nav-link:hover, .nav-link.active {
                background-color: rgba(52, 152, 219, 0.1);
                color: var(--primary);
                border-right-color: var(--primary);
            }
            
            .nav-link i {
                font-size: 1.2rem;
                min-width: 24px;
                text-align: center;
            }
            
            .sidebar.collapsed .nav-text {
                display: none;
            }
            
            /* Main Content */
            .main-content {
                flex: 1;
                padding: 20px;
                overflow-x: hidden;
            }
            
            .page-title {
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--light);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }
            
            /* Cards */
            .card {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                padding: 20px;
                margin-bottom: 20px;
                transition: var(--transition);
            }
            
            .card:hover {
                box-shadow: var(--shadow-lg);
            }
            
            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--light);
            }
            
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            
            .stat-card {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                padding: 20px;
                display: flex;
                align-items: center;
                gap: 15px;
                transition: var(--transition);
            }
            
            .stat-card:hover {
                transform: translateY(-5px);
                box-shadow: var(--shadow-lg);
            }
            
            .stat-icon {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.8rem;
            }
            
            .stat-info {
                flex: 1;
            }
            
            .stat-value {
                font-size: 1.8rem;
                font-weight: bold;
                margin-bottom: 5px;
            }
            
            .stat-label {
                color: var(--gray);
                font-size: 0.9rem;
            }
            
            .students-icon {
                background-color: rgba(52, 152, 219, 0.2);
                color: var(--primary);
            }
            
            .classes-icon {
                background-color: rgba(46, 204, 113, 0.2);
                color: var(--secondary);
            }
            
            .attendance-icon {
                background-color: rgba(155, 89, 182, 0.2);
                color: var(--accent);
            }
            
            .revenue-icon {
                background-color: rgba(243, 156, 18, 0.2);
                color: var(--warning);
            }
            
            /* Tables */
            .table-container {
                overflow-x: auto;
            }
            
            table {
                width: 100%;
                border-collapse: collapse;
            }
            
            th, td {
                padding: 12px 15px;
                text-align: right;
            }
            
            body.en th, body.en td {
                text-align: left;
            }
            
            thead th {
                background-color: var(--light);
                color: var(--dark);
                font-weight: bold;
                border-bottom: 2px solid var(--gray);
            }
            
            tbody tr {
                border-bottom: 1px solid var(--light);
                transition: var(--transition);
            }
            
            tbody tr:last-child {
                border-bottom: none;
            }
            
            tbody tr:hover {
                background-color: rgba(52, 152, 219, 0.05);
            }
            
            .table-action {
                color: var(--primary);
                cursor: pointer;
                margin: 0 5px;
                transition: var(--transition);
            }
            
            .table-action:hover {
                color: var(--primary-dark);
            }
            
            .table-action.delete {
                color: var(--danger);
            }
            
            .table-action.delete:hover {
                color: #c0392b;
            }
            
            .status {
                display: inline-block;
                padding: 5px 10px;
                border-radius: 20px;
                font-size: 0.8rem;
                font-weight: 500;
            }
            
            .status.active {
                background-color: rgba(46, 204, 113, 0.2);
                color: var(--secondary-dark);
            }
            
            .status.pending {
                background-color: rgba(243, 156, 18, 0.2);
                color: #d35400;
            }
            
            .status.inactive {
                background-color: rgba(231, 76, 60, 0.2);
                color: #c0392b;
            }
            
            /* Forms */
            .form-group {
                margin-bottom: 20px;
            }
            
            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: var(--dark);
            }
            
            .input-field {
                width: 100%;
                padding: 10px 15px;
                border: 1px solid #ddd;
                border-radius: var(--border-radius);
                font-family: 'Tajawal', sans-serif;
                font-size: 1rem;
                transition: var(--transition);
            }
            
            .input-field:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            }
            
            .form-row {
                display: flex;
                gap: 15px;
                margin-bottom: 20px;
            }
            
            .form-col {
                flex: 1;
            }
            
            /* Buttons */
            .btn {
                display: inline-block;
                padding: 10px 20px;
                border: none;
                border-radius: var(--border-radius);
                background-color: var(--primary);
                color: white;
                font-family: 'Tajawal', sans-serif;
                font-size: 1rem;
                font-weight: 500;
                cursor: pointer;
                transition: var(--transition);
                text-align: center;
            }
            
            .btn:hover {
                background-color: var(--primary-dark);
                transform: translateY(-2px);
            }
            
            .btn-secondary {
                background-color: var(--secondary);
            }
            
            .btn-secondary:hover {
                background-color: var(--secondary-dark);
            }
            
            .btn-danger {
                background-color: var(--danger);
            }
            
            .btn-danger:hover {
                background-color: #c0392b;
            }
            
            .btn-sm {
                padding: 5px 10px;
                font-size: 0.9rem;
            }
            
            .btn-link {
                background: none;
                color: var(--primary);
                padding: 0;
                text-decoration: underline;
            }
            
            .btn-link:hover {
                background: none;
                color: var(--primary-dark);
                transform: none;
            }
            
            /* Modals */
            .modal-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                visibility: hidden;
                transition: var(--transition);
            }
            
            .modal-backdrop.active {
                opacity: 1;
                visibility: visible;
            }
            
            .modal {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow-lg);
                width: 90%;
                max-width: 600px;
                max-height: 90vh;
                overflow-y: auto;
                transform: translateY(-20px);
                opacity: 0;
                transition: var(--transition);
            }
            
            .modal-backdrop.active .modal {
                transform: translateY(0);
                opacity: 1;
            }
            
            .modal-header {
                padding: 15px 20px;
                border-bottom: 1px solid var(--light);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .modal-title {
                font-size: 1.2rem;
                font-weight: bold;
            }
            
            .modal-close {
                background: none;
                border: none;
                font-size: 1.5rem;
                cursor: pointer;
                color: var(--gray);
                transition: var(--transition);
            }
            
            .modal-close:hover {
                color: var(--danger);
            }
            
            .modal-body {
                padding: 20px;
            }
            
            .modal-footer {
                padding: 15px 20px;
                border-top: 1px solid var(--light);
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }
            
            /* Login Page */
            .login-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            }
            
            .login-card {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow-lg);
                width: 90%;
                max-width: 400px;
                padding: 30px;
                animation: fadeIn 0.5s ease;
            }
            
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            .login-header {
                text-align: center;
                margin-bottom: 30px;
            }
            
            .login-header h2 {
                color: var(--primary);
                margin-bottom: 10px;
            }
            
            .login-header p {
                color: var(--gray);
            }
            
            .login-logo {
                font-size: 3rem;
                color: var(--primary);
                margin-bottom: 20px;
            }
            
            .login-tabs {
                display: flex;
                margin-bottom: 20px;
                border-bottom: 1px solid var(--light);
            }
            
            .login-tab {
                flex: 1;
                padding: 10px;
                text-align: center;
                cursor: pointer;
                color: var(--gray);
                transition: var(--transition);
            }
            
            .login-tab.active {
                color: var(--primary);
                border-bottom: 2px solid var(--primary);
            }
            
            .login-tab:hover:not(.active) {
                color: var(--dark);
            }
            
            .login-footer {
                text-align: center;
                margin-top: 20px;
                color: var(--gray);
            }
            
            .login-footer a {
                color: var(--primary);
                text-decoration: none;
            }
            
            .login-footer a:hover {
                text-decoration: underline;
            }
            
            /* Dashboard */
            .dashboard-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            @media (min-width: 768px) {
                .dashboard-grid {
                    grid-template-columns: 2fr 1fr;
                }
            }
            
            .upcoming-classes {
                margin-bottom: 30px;
            }
            
            .class-card {
                display: flex;
                align-items: center;
                gap: 15px;
                padding: 15px;
                border-radius: var(--border-radius);
                background-color: white;
                box-shadow: var(--shadow);
                margin-bottom: 15px;
                transition: var(--transition);
            }
            
            .class-card:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lg);
            }
            
            .class-color {
                width: 10px;
                height: 50px;
                border-radius: 4px;
            }
            
            .class-info {
                flex: 1;
            }
            
            .class-time {
                font-size: 0.9rem;
                color: var(--gray);
                margin-bottom: 5px;
            }
            
            .class-name {
                font-weight: 500;
                margin-bottom: 5px;
            }
            
            .class-details {
                font-size: 0.9rem;
                color: var(--gray);
            }
            
            .calendar {
                margin-bottom: 30px;
            }
            
            .calendar-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
            }
            
            .calendar-title {
                font-weight: 500;
            }
            
            .calendar-nav {
                display: flex;
                gap: 10px;
            }
            
            .calendar-nav-btn {
                background: none;
                border: none;
                color: var(--gray);
                cursor: pointer;
                transition: var(--transition);
            }
            
            .calendar-nav-btn:hover {
                color: var(--dark);
            }
            
            .calendar-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }
            
            .calendar-day-header {
                text-align: center;
                padding: 5px;
                font-weight: 500;
                color: var(--gray);
                font-size: 0.9rem;
            }
            
            .calendar-day {
                aspect-ratio: 1;
                border-radius: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: var(--transition);
                position: relative;
            }
            
            .calendar-day:hover {
                background-color: var(--light);
            }
            
            .calendar-day.today {
                background-color: rgba(52, 152, 219, 0.1);
                color: var(--primary);
                font-weight: bold;
            }
            
            .calendar-day.has-event::after {
                content: '';
                position: absolute;
                bottom: 5px;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background-color: var(--primary);
            }
            
            .calendar-day.other-month {
                color: var(--light);
            }
            
            /* Assignments */
            .assignment-card {
                display: flex;
                gap: 15px;
                padding: 15px;
                border-radius: var(--border-radius);
                background-color: white;
                box-shadow: var(--shadow);
                margin-bottom: 15px;
                transition: var(--transition);
            }
            
            .assignment-card:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lg);
            }
            
            .assignment-status {
                font-size: 1.8rem;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
            }
            
            .assignment-info {
                flex: 1;
            }
            
            .assignment-due {
                font-size: 0.9rem;
                color: var(--gray);
                margin-bottom: 5px;
            }
            
            .assignment-title {
                font-weight: 500;
                margin-bottom: 5px;
            }
            
            .assignment-class {
                font-size: 0.9rem;
                color: var(--gray);
            }
            
            /* Attendance */
            .attendance-card {
                margin-bottom: 30px;
            }
            
            .attendance-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
            }
            
            .attendance-date {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .attendance-date-btn {
                background: none;
                border: none;
                color: var(--gray);
                cursor: pointer;
                transition: var(--transition);
            }
            
            .attendance-date-btn:hover {
                color: var(--dark);
            }
            
            .attendance-filter {
                display: flex;
                gap: 10px;
            }
            
            .filter-btn {
                background: none;
                border: 1px solid var(--light);
                padding: 5px 10px;
                border-radius: 20px;
                color: var(--gray);
                cursor: pointer;
                transition: var(--transition);
                font-size: 0.9rem;
            }
            
            .filter-btn.active {
                background-color: var(--primary);
                color: white;
                border-color: var(--primary);
            }
            
            .attendance-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }
            
            .attendance-student {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                padding: 15px;
                text-align: center;
                transition: var(--transition);
                cursor: pointer;
            }
            
            .attendance-student:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lg);
            }
            
            .student-avatar {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background-color: var(--light);
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 10px;
                color: var(--primary);
                font-weight: bold;
                font-size: 1.2rem;
            }
            
            .attendance-student.present {
                border-bottom: 3px solid var(--success);
            }
            
            .attendance-student.absent {
                border-bottom: 3px solid var(--danger);
            }
            
            .attendance-student.late {
                border-bottom: 3px solid var(--warning);
            }
            
            .student-name {
                font-weight: 500;
                margin-bottom: 5px;
                font-size: 0.9rem;
            }
            
            .student-class {
                font-size: 0.8rem;
                color: var(--gray);
            }
            
            /* Subscriptions */
            .subscription-plans {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            
            .plan-card {
                background-color: white;
                border-radius: var(--border-radius);
                box-shadow: var(--shadow);
                padding: 30px 20px;

                    // تحقق من وجود المستخدم في التخزين المحلي

                    if (savedUser) {
                        appData.currentUser = JSON.parse(savedUser);
                        this.renderApp();
                    } else {
                        this.renderLogin();

                    // تعيين اللغة

                // إعداد مستمعي الأحداث
                setupEventListeners() {
                    // مستمع أحداث للنقرات في كامل التطبيق
                    document.addEventListener('click', (e) => {
                        const target = e.target;
                        
                        // مستمع أحداث تبديل اللغة
                        if (target.closest('.lang-switch')) {
                            this.toggleLanguage();
                        }
                        
                        // مستمع أحداث تبديل القائمة الجانبية
                        if (target.closest('.sidebar-toggle')) {
                            this.toggleSidebar();
                        }
                        
                        // مستمع أحداث تسجيل الخروج
                        if (target.closest('#logout')) {
                            e.preventDefault();
                            this.logout();
                        }
                        
                        // مستمع أحداث تبديل علامات تبويب تسجيل الدخول
                        if (target.classList.contains('login-tab')) {
                            const tabs = document.querySelectorAll('.login-tab');
                            tabs.forEach(tab => tab.classList.remove('active'));
                            target.classList.add('active');
                            
                            const tabType = target.dataset.type;
                            const loginForm = document.querySelector('#loginForm');
                            if (loginForm) {
                                loginForm.dataset.type = tabType;
                                
                                const titleEl = document.querySelector('.login-header h2');
                                if (titleEl) {
                                    const t = this.translate.bind(this);
                                    titleEl.textContent = tabType === 'teacher' ? t('teacherLogin') : t('studentLogin');
                                }
                            }
                        }
                        
                        // مستمع أحداث النقر على زر تسجيل الدخول
                        if (target.id === 'loginBtn') {
                            e.preventDefault();
                            this.handleLogin();
                        }
                        
                        // مستمع أحداث الإغلاق للحوارات المنبثقة
                        if (target.classList.contains('modal-backdrop') || target.classList.contains('modal-close') || target.classList.contains('btn-cancel')) {
                            const modalId = target.closest('.modal-backdrop')?.id || target.dataset.modal;
                            if (modalId) {
                                this.closeModal(modalId);
                            }
                        }
                        
                        // روابط التنقل
                        if (target.closest('[data-page]')) {
                            e.preventDefault();
                            const pageLink = target.closest('[data-page]');
                            const page = pageLink.dataset.page;
                            this.navigateTo(page);
                            
                            // إغلاق القائمة الجانبية في الأجهزة المحمولة
                            if (window.innerWidth < 992) {
                                document.querySelector('.sidebar').classList.add('collapsed');
                            }
                            
                            // تحديث الرابط النشط
                            document.querySelectorAll('.nav-link').forEach(link => {
                                link.classList.remove('active');
                            });
                            pageLink.classList.add('active');
                        }
                        
                        // زر إضافة فصل جديد
                        if (target.id === 'addClassBtn' || target.closest('#addClassBtn')) {
                            this.openModal('addClassModal');
                        }
                        
                        // زر إضافة طالب جديد
                        if (target.id === 'addStudentBtn' || target.closest('#addStudentBtn')) {
                            this.openModal('addStudentModal');
                        }
                        
                        // زر إضافة واجب جديد
                        if (target.id === 'addAssignmentBtn' || target.closest('#addAssignmentBtn')) {
                            this.openModal('addAssignmentModal');
                        }
                        
                        // زر إضافة امتحان جديد
                        if (target.id === 'addExamBtn' || target.closest('#addExamBtn')) {
                            this.openModal('addExamModal');
                        }
                        
                        // أزرار اشتراك
                        if (target.classList.contains('subscribe-btn')) {
                            const planId = target.dataset.plan;
                            this.handleSubscribe(planId);
                        }
                        
                        // أزرار فلتر الحضور
                        if (target.classList.contains('filter-btn')) {
                            const filterBtns = document.querySelectorAll('.filter-btn');
                            filterBtns.forEach(btn => btn.classList.remove('active'));
                            target.classList.add('active');
                            
                            const filter = target.dataset.filter;
                            this.filterAttendance(filter);
                        }
                        
                        // تبديل حالة حضور الطالب
                        if (target.closest('.attendance-student')) {
                            const studentEl = target.closest('.attendance-student');
                            const studentId = studentEl.dataset.id;
                            this.toggleAttendanceStatus(studentId, studentEl);
                        }
                    });
                    
                    // مستمع أحداث تقديم النموذج
                    document.addEventListener('submit', (e) => {
                        const form = e.target;
                        
                        // نموذج إضافة فصل
                        if (form.id === 'addClassForm') {
                            e.preventDefault();
                            this.handleAddClass(form);
                        }
                        
                        // نموذج إضافة طالب
                        if (form.id === 'addStudentForm') {
                            e.preventDefault();
                            this.handleAddStudent(form);

                translate(key) {
                    return translations[appData.currentLanguage][key] || key;

                    appData.currentLanguage = lang;
                    document.body.className = lang === 'en' ? 'en' : '';
                    localStorage.setItem('language', lang);
                    
                    // إعادة تحميل واجهة المستخدم
                    if (appData.currentUser) {
                        this.renderApp();
                    } else {
                        this.renderLogin();

                    this.renderPage(page);

                openModal(modalId) {
                    const modal = document.getElementById(modalId);
                    if (modal) {
                        modal.classList.add('active');
                        setTimeout(() => {
                            const firstInput = modal.querySelector('input');
                            if (firstInput) {
                                firstInput.focus();
                            }
                        }, 300);
                    }
                },
                
                // إغلاق حوار منبثق
